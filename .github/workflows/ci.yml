name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce_ci_password
          POSTGRES_DB: multi_vendor_ecommerce
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce -d multi_vendor_ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://ecommerce:ecommerce_ci_password@localhost:5433/multi_vendor_ecommerce
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # CI-only throwaway values — never real secrets, not used outside this workflow run.
      JWT_ACCESS_SECRET: ci-access-secret-do-not-use-in-production-0000000000000000
      JWT_REFRESH_SECRET: ci-refresh-secret-do-not-use-in-production-0000000000000000
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed database (ADMIN/VENDOR/CUSTOMER roles)
        run: npx prisma db seed

      - name: Lint (no auto-fix)
        run: npx eslint "{src,test}/**/*.ts"

      - name: Format check
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --runInBand

      - name: E2E tests
        run: npm run test:e2e -- --runInBand

      - name: Prisma schema validate
        run: npx prisma validate

      - name: Prisma migration status
        run: npx prisma migrate status
