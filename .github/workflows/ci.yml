name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce_ci_password
          POSTGRES_DB: multi_vendor_ecommerce
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ecommerce -d multi_vendor_ecommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://ecommerce:ecommerce_ci_password@localhost:5433/multi_vendor_ecommerce
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # CI-only throwaway values — never real secrets, not used outside this workflow run.
      JWT_ACCESS_SECRET: ci-access-secret-do-not-use-in-production-0000000000000000
      JWT_REFRESH_SECRET: ci-refresh-secret-do-not-use-in-production-0000000000000000
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      # Rate limiting: generous, CI-only values. The full e2e suite makes
      # 100+ register/login calls within a single window (every e2e spec
      # file shares one Redis-backed counter per route, and the whole
      # suite runs in well under a minute) — this keeps the throttler
      # guard genuinely active in CI (never disabled) without it tripping
      # on that legitimate test volume. Production uses much stricter
      # values (docs/deployment.md), never these.
      THROTTLE_TTL_MS: 60000
      THROTTLE_LIMIT: 2000
      THROTTLE_AUTH_LOGIN_LIMIT: 1000
      THROTTLE_AUTH_REGISTER_LIMIT: 1000
      THROTTLE_AUTH_REFRESH_LIMIT: 500
      THROTTLE_PAYMENTS_WEBHOOK_LIMIT: 500
      THROTTLE_PRODUCT_IMAGE_UPLOAD_LIMIT: 500
      THROTTLE_CHECKOUT_LIMIT: 500

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed database (ADMIN/VENDOR/CUSTOMER roles)
        run: npx prisma db seed

      - name: Lint (no auto-fix)
        run: npx eslint "{src,test}/**/*.ts"

      - name: Format check
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --runInBand

      - name: E2E tests
        run: npm run test:e2e -- --runInBand

      - name: Prisma schema validate
        run: npx prisma validate

      - name: Prisma migration status
        run: npx prisma migrate status
