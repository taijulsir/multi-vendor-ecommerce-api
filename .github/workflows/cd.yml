name: CD (Production Deploy)

# Fires only after the "CI" workflow (.github/workflows/ci.yml) COMPLETES
# for a push whose target was `main` -- never for `development`, and
# never merely because a workflow file changed. `workflow_run`'s
# `branches:` filter matches the branch that triggered the upstream run,
# not this workflow's own ref, which is exactly "deploy only after CI
# succeeds, only for main."
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Two production deploys must never race. cancel-in-progress:false means
# a second `main` push while one deploy is running QUEUES behind it
# instead of cancelling it mid-flight (which could leave the VPS with a
# half-applied migration or a stopped-but-not-restarted container).
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Guard job: only proceed if the upstream CI run actually succeeded.
  # A `workflow_run` event fires on completion regardless of outcome
  # (success, failure, or cancelled) -- every later job depends on this
  # one specifically to enforce "ONLY after CI succeeds".
  gate:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded for ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "CI run: ${{ github.event.workflow_run.html_url }}"
          echo "Commit: ${{ github.event.workflow_run.head_sha }}"

  # Validates the production compose file BEFORE building/pushing
  # anything -- cheap, fast, catches a YAML/interpolation mistake in
  # docker-compose.prod.yml without touching GHCR or the VPS. Uses
  # explicit, clearly-fake, non-secret placeholders (never .env.example,
  # which stays a development template) -- see docs/deployment.md
  # "CI/CD: compose validation" for why and the exact command.
  validate-compose:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate docker-compose.prod.yml
        run: |
          # The app service's `env_file: .env.production` makes `compose
          # config` fail outright if that file doesn't exist -- true by
          # design everywhere except the VPS itself (Section 6). An
          # empty placeholder here satisfies the file-existence check
          # without providing (or needing) a single real value; it's
          # only ever created inside this ephemeral runner and never
          # committed.
          touch .env.production
          POSTGRES_PASSWORD=ci-validate-placeholder-not-a-real-secret \
          IMAGE_TAG=ci-validate-placeholder \
            docker compose -f docker-compose.prod.yml config --quiet
          rm -f .env.production

  build-and-push:
    needs: validate-compose
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.tags.outputs.sha-ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute image tags
        id: tags
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          echo "sha-ref=${IMAGE}:${SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (immutable SHA tag + convenience latest tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tags.outputs.sha-ref }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://e-commerce.api.taijul.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Copies only docker-compose.prod.yml -- the one file the VPS
      # needs updated when this repo changes it. Everything else
      # (.env.production, the storage bind mount, the volumes) already
      # lives on the VPS and is intentionally untouched by CD.
      - name: Sync docker-compose.prod.yml to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml \
            "$VPS_USER@$VPS_HOST:/srv/multi-vendor-ecommerce-api/docker-compose.prod.yml"

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-ref }}
        run: |
          # The deploy logic lives in its own file
          # (.github/scripts/remote-deploy.sh), streamed to the VPS over
          # stdin and executed there -- not an inline heredoc, which
          # fights YAML's block-scalar indentation rules against bash's
          # own "heredoc terminator must be at column 0" requirement.
          # $IMAGE_TAG is exported into the remote shell explicitly,
          # never interpolated into the ssh command string itself --
          # keeps it out of any command-line echo/tracing and out of
          # shell history on the VPS. (It isn't secret, but the pattern
          # is the same one used for anything that is.)
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' bash -s" < .github/scripts/remote-deploy.sh

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Public HTTPS health check (through Nginx, the real client path)
        run: |
          for i in $(seq 1 15); do
            body="$(curl -sf https://e-commerce.api.taijul.dev/api/health || true)"
            if echo "$body" | grep -q '"database":"up"' && echo "$body" | grep -q '"redis":"up"'; then
              echo "Public health check passed: $body"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Public health check never reported database+redis up"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies (for Newman)
        run: npm ci

      - name: Production smoke suite (ADMIN-independent)
        run: npm run test:smoke
